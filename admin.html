<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DREQ — Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f3f6f8;color:#18343b}
    header{background:#123b43;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    h1{font-size:22px;margin:0}
    main{max-width:1050px;margin:30px auto;padding:0 16px}
    .panel{background:white;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 4px 18px #102f3a10}
    h2{font-size:19px;margin:0 0 10px}
    p{color:#64777d;line-height:1.5}
    button,select{font:inherit;border-radius:8px;padding:11px 14px}
    button{border:0;background:#167b78;color:white;cursor:pointer;font-weight:600}
    button.secondary{background:#e8eff0;color:#24434a}
    button:disabled{opacity:.5;cursor:not-allowed}
    select{border:1px solid #d4dfe1;background:white;max-width:100%}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
    .student{border:1px solid #e3eaec;border-radius:11px;padding:15px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
    .student strong{display:block;margin-bottom:5px}
    .email{font-size:13px;color:#718187}
    .access{display:flex;gap:8px;flex-wrap:wrap}
    .access button{min-width:90px}
    .on{background:#167b78}
    .off{background:#e9eeee;color:#4b6065}
    #message{padding:12px;border-radius:9px;margin:12px 0;display:none;white-space:pre-wrap}
    #message.error{display:block;background:#fff0ef;color:#a42e28}
    #message.success{display:block;background:#eaf7f1;color:#176344}
    .empty{padding:18px;color:#718187;text-align:center}
    @media(max-width:600px){header{padding:18px}main{margin:18px auto}.panel{padding:16px}.student{align-items:flex-start}}
  </style>
</head>
<body>
<header>
  <h1>DREQ — Administration</h1>
  <button class="secondary" id="logoutBtn">Déconnexion</button>
</header>

<main>
  <section class="panel">
    <h2>Gestion des accès étudiants</h2>
    <p>Active ou désactive l'accès aux semestres S1 et S3 après vérification du paiement.</p>
    <div id="message"></div>
    <div class="toolbar">
      <input id="search" type="text" placeholder="Rechercher un étudiant..."
        style="padding:11px;border:1px solid #d4dfe1;border-radius:8px;flex:1;min-width:180px">
      <button id="refreshBtn" class="secondary">Actualiser</button>
    </div>
    <div id="students"><div class="empty">Chargement des étudiants...</div></div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://ttrunryfmwtantycmkor.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pv7eoks18qa19-DBSVxBKg_jE8m_OVI";
const ADMIN_EMAIL = "alialiamal2024@gmail.com";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let students = [];
let semesters = [];
let accessRows = [];

const $ = id => document.getElementById(id);

function message(text, type="success") {
  const el = $("message");
  el.textContent = text;
  el.className = type;
}

function hideMessage() {
  $("message").style.display = "none";
  $("message").className = "";
}

function semesterCode(s) {
  const value = String(s.code || s.name || s.title || s.label || "").toUpperCase().replace(/\s/g,"");
  if (value.includes("S1") || value.includes("SEMESTRE1")) return "S1";
  if (value.includes("S3") || value.includes("SEMESTRE3")) return "S3";
  return "";
}

async function start() {
  const { data: { session }, error } = await db.auth.getSession();

  if (error || !session) {
    document.body.innerHTML = "<main><section class='panel'><h2>Connexion nécessaire</h2><p>Connecte-toi depuis la page principale DREQ avec le compte administrateur.</p><button onclick=\"location.href='index.html'\">Retour à l'accueil</button></section></main>";
    return;
  }

  if ((session.user.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    document.body.innerHTML = "<main><section class='panel'><h2>Accès refusé</h2><p>Cette page est réservée à l'administratrice.</p><button onclick=\"location.href='index.html'\">Retour</button></section></main>";
    return;
  }

  await loadData();
}

async function loadData() {
  hideMessage();
  $("students").innerHTML = "<div class='empty'>Chargement...</div>";

  const [profilesResult, semestersResult, accessResult] = await Promise.all([
    db.from("profiles").select("*"),
    db.from("semesters").select("*"),
    db.from("student_access").select("*")
  ]);

  if (profilesResult.error) {
    message("Erreur lors du chargement des étudiants : " + profilesResult.error.message, "error");
    $("students").innerHTML = "";
    return;
  }
  if (semestersResult.error) {
    message("Erreur lors du chargement des semestres : " + semestersResult.error.message, "error");
    $("students").innerHTML = "";
    return;
  }
  if (accessResult.error) {
    message("Erreur lors du chargement des accès : " + accessResult.error.message, "error");
    $("students").innerHTML = "";
    return;
  }

  students = (profilesResult.data || []).filter(p =>
    String(p.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()
  );
  semesters = (semestersResult.data || []).filter(s => ["S1","S3"].includes(semesterCode(s)));
  accessRows = accessResult.data || [];

  if (!semesters.length) {
    message("Je ne trouve pas S1 et S3 dans la table semesters. Vérifie que leurs noms ou codes sont bien S1 et S3.", "error");
  }

  renderStudents();
}

function hasAccess(studentId, semesterId) {
  return accessRows.some(a =>
    String(a.student_id) === String(studentId) &&
    String(a.semester_id) === String(semesterId) &&
    a.enabled === true
  );
}

function renderStudents() {
  const term = $("search").value.trim().toLowerCase();
  const filtered = students.filter(s =>
    String(s.full_name || "").toLowerCase().includes(term) ||
    String(s.email || "").toLowerCase().includes(term)
  );

  if (!filtered.length) {
    $("students").innerHTML = "<div class='empty'>Aucun étudiant trouvé.</div>";
    return;
  }

  $("students").innerHTML = "";

  filtered.forEach(student => {
    const card = document.createElement("div");
    card.className = "student";

    const info = document.createElement("div");
    const name = document.createElement("strong");
    name.textContent = student.full_name || "Étudiant";
    const email = document.createElement("div");
    email.className = "email";
    email.textContent = student.email || "";
    info.append(name, email);

    const controls = document.createElement("div");
    controls.className = "access";

    ["S1","S3"].forEach(code => {
      const semester = semesters.find(s => semesterCode(s) === code);
      const btn = document.createElement("button");

      if (!semester) {
        btn.textContent = code + " indisponible";
        btn.disabled = true;
        btn.className = "off";
      } else {
        const active = hasAccess(student.id, semester.id);
        btn.textContent = code + (active ? " — Activé" : " — Désactivé");
        btn.className = active ? "on" : "off";
        btn.addEventListener("click", () =>
          changeAccess(student.id, semester.id, !active, btn)
        );
      }
      controls.appendChild(btn);
    });

    card.append(info, controls);
    $("students").appendChild(card);
  });
}

async function changeAccess(studentId, semesterId, enable, button) {
  button.disabled = true;
  hideMessage();

  const existing = accessRows.find(a =>
    String(a.student_id) === String(studentId) &&
    String(a.semester_id) === String(semesterId)
  );

  let result;

  if (existing) {
    result = await db.from("student_access")
      .update({ enabled: enable })
      .eq("student_id", studentId)
      .eq("semester_id", semesterId);
  } else {
    result = await db.from("student_access").insert({
      student_id: studentId,
      semester_id: semesterId,
      enabled: enable,
      granted_at: new Date().toISOString()
    });
  }

  button.disabled = false;

  if (result.error) {
    message("Impossible de modifier l'accès : " + result.error.message, "error");
    return;
  }

  message("Accès " + (enable ? "activé" : "désactivé") + " avec succès.");
  await loadData();
}

$("search").addEventListener("input", renderStudents);
$("refreshBtn").addEventListener("click", loadData);

$("logoutBtn").addEventListener("click", async () => {
  await db.auth.signOut();
  location.href = "index.html";
});

start();
</script>
</body>
</html>
