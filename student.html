
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DREQ — Espace étudiant</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#123C46;--teal:#176B70;--mint:#45B8A5;
  --pale:#D9F0EC;--bg:#F5F8F8;--card:#fff;
  --text:#19363B;--muted:#71868A;--line:#E3ECEB;
  --shadow:0 8px 28px rgba(18,60,70,.07);
}
body.dark{
  --navy:#D9F0EC;--teal:#45B8A5;--mint:#45B8A5;
  --pale:#183B43;--bg:#0C1C23;--card:#142B33;
  --text:#EDF7F5;--muted:#A9C0C0;--line:#29454B;
  --shadow:0 8px 28px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;transition:.2s}
button,input{font:inherit}
button{cursor:pointer}
header{
  padding:18px 5%;background:var(--card);
  border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;
}
.logo{font-size:27px;font-weight:900;letter-spacing:3px;color:var(--teal)}
.logo small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted)}
.header-actions{display:flex;gap:9px}
button{
  border:0;border-radius:10px;padding:12px 17px;
  background:var(--teal);color:white;font-weight:700;
}
button.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}
button:hover{opacity:.88}
main{max-width:1150px;margin:32px auto;padding:0 18px;min-height:70vh}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:17px;padding:22px;margin-bottom:18px;
  box-shadow:var(--shadow);
}
h1,h2,h3{color:var(--text);margin-top:0}
.muted{color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:17px}
.semester{
  background:var(--card);border:1px solid var(--line);
  color:var(--teal);border-radius:16px;padding:25px;
  text-align:center;font-size:23px;font-weight:800;
  box-shadow:var(--shadow);min-height:110px;
}
.module{
  background:var(--card);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;cursor:pointer;
  box-shadow:var(--shadow);transition:.2s;
}
.module:hover,.course:hover{transform:translateY(-3px)}
.module img{width:100%;height:155px;object-fit:cover;background:var(--pale)}
.module-info{padding:17px}
.module-info h3{margin:0 0 8px}
.course{
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:17px;margin:12px 0;
  transition:.2s;box-shadow:var(--shadow);
}
.course img{width:75px;height:65px;object-fit:cover;border-radius:9px}
.course-info{flex:1}
.course-info h3{font-size:16px;margin:0 0 7px}
.back{margin-bottom:17px}
input{
  width:100%;padding:13px;margin:7px 0 14px;
  border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--text);
}
.hidden{display:none!important}
#message{margin:12px 0;color:var(--teal);line-height:1.6}
.lesson-content{
  white-space:pre-wrap;line-height:1.9;
  overflow-wrap:anywhere;font-size:15px;
}
.question{margin:16px 0;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.question h3{font-size:16px;line-height:1.6}
.answer{
  display:flex;gap:10px;align-items:flex-start;
  padding:12px;border:1px solid var(--line);
  border-radius:9px;margin:9px 0;cursor:pointer;
}
.answer input{width:auto;margin:3px 0}
.result{margin-top:12px;padding:12px;border-radius:9px;line-height:1.7}
.good{background:#D9F0EC;color:#176B70}
.bad{background:#FCEBED;color:#A83E49}
.empty{text-align:center;padding:30px;color:var(--muted)}
.pdf-link{display:inline-block;margin:12px 0;color:var(--teal);font-weight:bold}
footer{text-align:center;padding:30px;color:var(--muted);font-size:12px}
@media(max-width:600px){
  main{margin:20px auto}
  .course{align-items:flex-start;flex-wrap:wrap}
  .course button{width:100%}
}
</style>
</head>
<body>

<header>
  <div class="logo">DREQ<small>MEDICAL LEARNING</small></div>
  <div class="header-actions">
    <button class="secondary" id="themeBtn">☀ / ☾</button>
    <button class="secondary" id="logoutBtn">Déconnexion</button>
  </div>
</header>

<main>
<div id="message"></div>

<section id="login" class="card hidden">
  <h2>Connexion étudiant</h2>
  <p class="muted">Connecte-toi à ton espace DREQ.</p>
  <label>E-mail</label>
  <input id="email" type="email" placeholder="Adresse e-mail">
  <label>Mot de passe</label>
  <input id="password" type="password" placeholder="Mot de passe">
  <button id="loginBtn">Se connecter</button>
</section>

<section id="home" class="hidden">
  <div class="card">
    <h1>Bonjour 👋</h1>
    <p class="muted" id="studentEmail"></p>
    <h2>Mes semestres</h2>
  </div>
  <div id="semesters" class="grid"></div>
</section>

<section id="modulesPage" class="hidden">
  <button class="secondary back" onclick="showHome()">← Retour</button>
  <div class="card">
    <h1 id="semesterTitle">Modules</h1>
    <p class="muted">Choisis un module.</p>
  </div>
  <div id="modules" class="grid"></div>
</section>

<section id="coursesPage" class="hidden">
  <button class="secondary back" onclick="showModules()">← Retour</button>
  <div class="card">
    <h1 id="moduleTitle">Cours</h1>
  </div>
  <div id="courses"></div>
</section>

<section id="lessonPage" class="hidden">
  <button class="secondary back" onclick="showCourses()">← Retour aux cours</button>
  <div class="card">
    <h1 id="lessonTitle">Cours</h1>
    <p id="lessonDescription" class="muted"></p>
    <div id="lessonContent" class="lesson-content"></div>
    <a id="lessonPdf" class="pdf-link hidden" target="_blank" rel="noopener">📄 Consulter le document PDF</a>
  </div>
  <div class="card">
    <h2>QCM / QCU</h2>
    <div id="lessonQuestions"></div>
  </div>
</section>

</main>
<footer>© 2026 DREQ Medical Learning</footer>

<script>
const SUPABASE_URL="https://ttrunryfmwtantycmkor.supabase.co";
const SUPABASE_KEY="sb_publishable_pv7eoks18qa19-DBSVxBKg_jE8m_OVI";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
let currentSemester=null;
let currentModule=null;
let currentCourse=null;

function msg(t){$("message").textContent=t}
function hidePages(){
  ["login","home","modulesPage","coursesPage","lessonPage"]
  .forEach(id=>$(id).classList.add("hidden"));
}
function showHome(){
  hidePages();
  $("home").classList.remove("hidden");
}
function showModules(){
  hidePages();
  $("modulesPage").classList.remove("hidden");
}
function showCourses(){
  hidePages();
  $("coursesPage").classList.remove("hidden");
}
function theme(){
  const dark=document.body.classList.toggle("dark");
  localStorage.setItem("dreq-theme",dark?"dark":"light");
}
$("themeBtn").onclick=theme;
if(localStorage.getItem("dreq-theme")==="dark"){
  document.body.classList.add("dark");
}

$("loginBtn").onclick=async()=>{
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password)return msg("Entre ton e-mail et ton mot de passe.");
  msg("Connexion...");
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error)return msg(error.message);
  await start();
};

$("logoutBtn").onclick=async()=>{
  await db.auth.signOut();
  hidePages();
  $("login").classList.remove("hidden");
  msg("Tu es déconnecté.");
};

async function start(){
  const {data:{user}}=await db.auth.getUser();
  if(!user){
    hidePages();
    $("login").classList.remove("hidden");
    return;
  }
  $("studentEmail").textContent=user.email||"";
  await loadSemesters(user.id);
}

async function loadSemesters(userId){
  hidePages();
  $("home").classList.remove("hidden");
  $("semesters").innerHTML="Chargement...";
  msg("");

  const {data:access,error}=await db.from("student_access")
    .select("semester_id")
    .eq("student_id",userId)
    .eq("enabled",true);

  if(error){
    $("semesters").innerHTML="";
    msg("Erreur de chargement : "+error.message);
    return;
  }

  if(!access||access.length===0){
    $("semesters").innerHTML="<div class='empty'>Aucun semestre disponible.</div>";
    return;
  }

  const ids=access.map(a=>a.semester_id);
  const {data:semesters,error:semError}=await db.from("semesters")
    .select("*")
    .in("id",ids)
    .eq("is_published",true);

  if(semError){
    $("semesters").innerHTML="";
    msg("Erreur : "+semError.message);
    return;
  }

  $("semesters").innerHTML="";
  if(!semesters||!semesters.length){
    $("semesters").innerHTML="<div class='empty'>Aucun semestre disponible.</div>";
    return;
  }

  semesters.forEach(s=>{
    const button=document.createElement("button");
    button.className="semester";
    button.textContent=s.code||s.name||"Semestre";
    button.onclick=()=>openSemester(s);
    $("semesters").appendChild(button);
  });
}

async function openSemester(semester){
  currentSemester=semester;
  $("semesterTitle").textContent=semester.name||semester.code||"Modules";
  showModules();
  $("modules").innerHTML="Chargement...";

  const {data,error}=await db.from("modules")
    .select("*")
    .eq("semester_id",semester.id)
    .eq("is_published",true);

  if(error){
    $("modules").textContent="Erreur : "+error.message;
    return;
  }

  $("modules").innerHTML="";
  if(!data||!data.length){
    $("modules").innerHTML="<div class='empty'>Aucun module disponible pour le moment.</div>";
    return;
  }

  data.forEach(m=>{
    const article=document.createElement("article");
    article.className="module";

    const img=document.createElement("img");
    img.src=m.image_url||"https://placehold.co/600x300/EAF3F2/176B70?text=DREQ";
    img.alt=m.name||"Module";

    const info=document.createElement("div");
    info.className="module-info";

    const title=document.createElement("h3");
    title.textContent=m.name||"Module";

    const description=document.createElement("p");
    description.className="muted";
    description.textContent=m.description||"Consulter les cours";

    info.append(title,description);
    article.append(img,info);
    article.onclick=()=>openModule(m);
    $("modules").appendChild(article);
  });
}

async function openModule(module){
  currentModule=module;
  $("moduleTitle").textContent=module.name||"Cours";
  showCourses();
  $("courses").innerHTML="Chargement...";

  const {data,error}=await db.from("courses")
    .select("*")
    .eq("module_id",module.id)
    .eq("is_published",true);

  if(error){
    $("courses").textContent="Erreur : "+error.message;
    return;
  }

  $("courses").innerHTML="";
  if(!data||!data.length){
    $("courses").innerHTML="<div class='empty'>Aucun cours disponible pour le moment.</div>";
    return;
  }

  data.forEach(c=>{
    const article=document.createElement("article");
    article.className="course";

    if(c.image_url){
      const img=document.createElement("img");
      img.src=c.image_url;
      img.alt=c.name||"Cours";
      article.appendChild(img);
    }

    const info=document.createElement("div");
    info.className="course-info";

    const title=document.createElement("h3");
    title.textContent=c.name||"Cours";

    const description=document.createElement("p");
    description.className="muted";
    description.textContent=c.description||"Consulter le cours";

    info.append(title,description);

    const btn=document.createElement("button");
    btn.textContent="Ouvrir le cours";
    btn.onclick=()=>openLesson(c);

    article.append(info,btn);
    $("courses").appendChild(article);
  });
}

async function openLesson(course){
  currentCourse=course;
  hidePages();
  $("lessonPage").classList.remove("hidden");

  $("lessonTitle").textContent=course.name||"Cours";
  $("lessonDescription").textContent=course.description||"";
  $("lessonContent").textContent=course.content||"Le contenu de ce cours n'a pas encore été ajouté.";

  const pdf=$("lessonPdf");
  if(course.file_url){
    pdf.href=course.file_url;
    pdf.classList.remove("hidden");
  }else{
    pdf.classList.add("hidden");
  }

  $("lessonQuestions").innerHTML="Chargement des questions...";

  const {data:questions,error}=await db.from("dreq_questions")
    .select("*")
    .eq("course_id",course.id)
    .eq("is_published",true);

  if(error){
    $("lessonQuestions").textContent="Erreur : "+error.message;
    return;
  }

  $("lessonQuestions").innerHTML="";

  if(!questions||!questions.length){
    $("lessonQuestions").innerHTML="<div class='empty'>Aucune question disponible pour ce cours.</div>";
    return;
  }

  for(const q of questions){
    const {data:answers,error:aError}=await db.from("dreq_answers")
      .select("*")
      .eq("question_id",q.id);

    if(aError){
      $("lessonQuestions").textContent=
        "Impossible de charger les réponses. Vérification des autorisations nécessaire.";
      console.error(aError);
      return;
    }

    const box=document.createElement("div");
    box.className="question";

    const title=document.createElement("h3");
    title.textContent=q.question_text;
    box.appendChild(title);

    const selected=new Set();
    const inputs=[];

    (answers||[]).forEach((a,i)=>{
      const label=document.createElement("label");
      label.className="answer";

      const input=document.createElement("input");
      input.type=q.question_type==="QCU"?"radio":"checkbox";
      input.name="question-"+q.id;
      input.value=i;

      input.onchange=()=>{
        if(input.type==="radio"){
          selected.clear();
          selected.add(i);
        }else{
          if(input.checked)selected.add(i);
          else selected.delete(i);
        }
      };

      inputs.push(input);
      const text=document.createElement("span");
      text.textContent=a.answer_text;
      label.append(input,text);
      box.appendChild(label);
    });

    const verify=document.createElement("button");
    verify.textContent="Vérifier ma réponse";

    const result=document.createElement("div");
    result.className="hidden";

    verify.onclick=()=>{
      if(selected.size===0){
        result.className="result bad";
        result.textContent="Choisis une réponse.";
        return;
      }

      const correct=(answers||[])
        .map((a,i)=>a.is_correct?i:-1)
        .filter(i=>i>=0);

      const chosen=[...selected];
      const isCorrect=chosen.length===correct.length&&
        chosen.every(i=>correct.includes(i));

      result.className="result "+(isCorrect?"good":"bad");
      result.textContent=(isCorrect?"Bonne réponse ! ":"Réponse incorrecte. ")+
        (q.explanation||"");
    };

    box.append(verify,result);
    $("lessonQuestions").appendChild(box);
  }
}

async function showCourses(){
  hidePages();
  $("coursesPage").classList.remove("hidden");
}

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session)await start();
  else{
    hidePages();
    $("login").classList.remove("hidden");
  }
})();
</script>
</body>
</html>
