
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DREQ — Espace étudiant</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f6f5;--card:#fff;--text:#18332e;--muted:#71817c;--accent:#087f70;--border:#dce7e3}
body.dark{--bg:#091827;--card:#10243a;--text:#f4f8fc;--muted:#a9bbcc;--accent:#38d9c0;--border:#294052}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;transition:.2s}
header{padding:20px 5%;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:900;letter-spacing:2px;color:var(--accent)}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:white;font-weight:bold;cursor:pointer}
button.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}
main{max-width:1100px;margin:35px auto;padding:0 18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:22px;margin-bottom:18px}
h1,h2,h3{margin-top:0}
.muted{color:var(--muted);line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.semester,.module,.course{padding:20px;background:var(--card);border:1px solid var(--border);border-radius:15px;text-align:left}
.semester h3,.module h3{margin:0 0 8px}
.module{padding:0;overflow:hidden;cursor:pointer}
.module img{width:100%;height:135px;object-fit:cover;background:#dce7e3}
.module div{padding:17px}
.course{margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
input{width:100%;padding:13px;margin:7px 0 14px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text)}
.hidden{display:none!important}
#message{padding:12px;border-radius:9px;margin:12px 0;color:var(--accent)}
.back{margin-bottom:18px}
footer{text-align:center;padding:30px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo">DREQ</div>
  <div>
    <button class="secondary" id="themeBtn">☀ / ☾</button>
    <button class="secondary" id="logoutBtn">Déconnexion</button>
  </div>
</header>

<main>
  <div id="message"></div>

  <section id="login" class="card hidden">
    <h2>Connexion étudiant</h2>
    <p class="muted">Connecte-toi avec ton compte DREQ.</p>
    <label>E-mail</label>
    <input id="email" type="email" placeholder="Adresse e-mail">
    <label>Mot de passe</label>
    <input id="password" type="password" placeholder="Mot de passe">
    <button id="loginBtn">Se connecter</button>
  </section>

  <section id="home" class="hidden">
    <div class="card">
      <h1>Bonjour 👋</h1>
      <p class="muted" id="studentEmail"></p>
      <h2>Mes semestres</h2>
      <p class="muted">Voici les semestres activés par l’administration pour ton compte.</p>
    </div>
    <div id="semesters" class="grid"></div>
  </section>

  <section id="modulesPage" class="hidden">
    <button class="secondary back" onclick="showHome()">← Retour aux semestres</button>
    <div class="card">
      <h1 id="semesterTitle">Modules</h1>
      <p class="muted">Choisis un module pour consulter ses cours.</p>
    </div>
    <div id="modules" class="grid"></div>
  </section>

  <section id="coursesPage" class="hidden">
    <button class="secondary back" onclick="showModules()">← Retour aux modules</button>
    <div class="card">
      <h1 id="moduleTitle">Cours</h1>
      <p class="muted">Les cours disponibles dans ce module.</p>
    </div>
    <div id="courses"></div>
  </section>
</main>

<footer>© 2026 DREQ Medical Learning</footer>

<script>
const SUPABASE_URL="https://ttrunryfmwtantycmkor.supabase.co";
const SUPABASE_KEY="sb_publishable_pv7eoks18qa19-DBSVxBKg_jE8m_OVI";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
let currentSemester=null;
let currentModule=null;

function msg(t){$("message").textContent=t}
function hidePages(){
  ["login","home","modulesPage","coursesPage"].forEach(id=>$(id).classList.add("hidden"));
}
function showHome(){
  hidePages();$("home").classList.remove("hidden");
}
function showModules(){
  hidePages();$("modulesPage").classList.remove("hidden");
}
function theme(){
  const dark=document.body.classList.toggle("dark");
  localStorage.setItem("dreq-theme",dark?"dark":"light");
}
$("themeBtn").onclick=theme;
if(localStorage.getItem("dreq-theme")==="dark")document.body.classList.add("dark");

$("loginBtn").onclick=async()=>{
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password)return msg("Entre ton e-mail et ton mot de passe.");
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error)return msg(error.message);
  await start();
};

$("logoutBtn").onclick=async()=>{
  await db.auth.signOut();
  hidePages();$("login").classList.remove("hidden");
  msg("Tu es déconnecté.");
};

async function start(){
  const {data:{user}}=await db.auth.getUser();
  if(!user){
    hidePages();$("login").classList.remove("hidden");
    return;
  }
  $("studentEmail").textContent=user.email||"";
  await loadSemesters(user.id);
}

async function loadSemesters(userId){
  hidePages();$("home").classList.remove("hidden");
  $("semesters").innerHTML="";

  const {data:access,error}=await db
    .from("student_access")
    .select("*")
    .eq("student_id",userId)
    .eq("enabled",true);

  if(error){msg("Impossible de charger tes accès : "+error.message);return}
  if(!access||access.length===0){
    msg("Aucun semestre n’est encore activé pour ton compte. Contacte l’administration.");
    return;
  }

  const ids=access.map(a=>a.semester_id);
  const {data:semesters,error:semError}=await db
    .from("semesters").select("*").in("id",ids);

  if(semError){msg("Erreur de chargement des semestres : "+semError.message);return}

  semesters.forEach(s=>{
    const name=s.name||s.code||s.title||"Semestre";
    const div=document.createElement("button");
    div.className="semester";
    div.innerHTML="<h3></h3><p class='muted'>Accès activé</p>";
    div.querySelector("h3").textContent=name;
    div.onclick=()=>openSemester(s);
    $("semesters").appendChild(div);
  });
}

async function openSemester(semester){
  currentSemester=semester;
  $("semesterTitle").textContent=semester.name||semester.code||"Modules";
  showModules();
  $("modules").innerHTML="Chargement...";
  const {data,error}=await db.from("modules").select("*");
  if(error){$("modules").textContent="Erreur : "+error.message;return}

  const list=(data||[]).filter(m=>
    String(m.semester_id)===String(semester.id)
  );
  $("modules").innerHTML="";
  if(!list.length){$("modules").textContent="Aucun module disponible pour le moment.";return}

  list.forEach(m=>{
    const name=m.name||m.title||"Module";
    const image=m.image_url||m.image||"";
    const div=document.createElement("article");
    div.className="module";
    div.innerHTML="<img alt=''><div><h3></h3><p class='muted'>Consulter les cours →</p></div>";
    div.querySelector("img").src=image||"https://placehold.co/600x300?text=DREQ";
    div.querySelector("h3").textContent=name;
    div.onclick=()=>openModule(m);
    $("modules").appendChild(div);
  });
}

async function openModule(module){
  currentModule=module;
  $("moduleTitle").textContent=module.name||module.title||"Cours";
  hidePages();$("coursesPage").classList.remove("hidden");
  $("courses").innerHTML="Chargement...";

  const {data,error}=await db.from("courses").select("*")
    .eq("module_id",module.id);

  if(error){$("courses").textContent="Les cours ne sont pas encore configurés.";return}
  $("courses").innerHTML="";
  if(!data||!data.length){$("courses").textContent="Aucun cours disponible pour le moment.";return}

  data.forEach(c=>{
    const div=document.createElement("div");
    div.className="course";
    const title=document.createElement("strong");
    title.textContent=c.name||c.title||"Cours";
    const btn=document.createElement("button");
    btn.textContent="Ouvrir";
    btn.onclick=()=>msg("Le lecteur de cours sera activé dans la prochaine étape.");
    div.append(title,btn);
    $("courses").appendChild(div);
  });
}

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session)await start();
  else{$("login").classList.remove("hidden")}
})();
</script>
</body>
</html>
